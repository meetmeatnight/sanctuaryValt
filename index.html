<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Private space">
    <title>Our Sanctuary</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
    <link rel="stylesheet" href="css/style.css?v=20260920h">

    <!-- Add to Home Screen — launches full-screen, without Safari's browser chrome -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Our Sanctuary">
    <meta name="theme-color" content="#0E0810">
</head>
<body class="page-gate" style="visibility:hidden">

    <div class="bg-layer"></div>
    <div class="hearts-container"></div>

    <main class="gate-card">
        <span class="gate-ornament">❧</span>
        <h1 class="gate-title" id="gate-title">Our Sanctuary</h1>
        <p class="gate-subtitle">a private space, just for us</p>
        <div class="gate-divider"></div>

        <form id="login-form" class="gate-form" autocomplete="off">
            <input
                type="text"
                id="name-input"
                class="password-field"
                placeholder="your name"
                autocomplete="name"
                maxlength="40"
                required
            >
            <input
                type="password"
                id="password-input"
                class="password-field"
                placeholder="enter your key"
                autocomplete="current-password"
                required
            >
            <p class="error-msg" id="error-msg" hidden aria-live="polite">
                Incorrect password. Please try again.
            </p>
            <button type="submit" class="enter-btn" id="enter-btn">
                <span>Enter</span>
                <span class="btn-arrow">→</span>
            </button>
        </form>

        <p class="gate-note">protected · for your eyes only</p>
    </main>

    <script src="js/config.js?v=20260920h"></script>
    <script src="js/crypto.js?v=20260920h"></script>
    <script src="js/auth.js?v=20260920h"></script>
    <!-- storage.js + firebase.js: needed here so clearLocalVaultDataIfSignedOut() can verify
         everything is actually backed up to the cloud before wiping anything on this page -->
    <script src="js/storage.js?v=20260920h"></script>
    <script src="js/firebase.js?v=20260920h"></script>
    <script src="js/hearts.js?v=20260920h"></script>
    <script>
        // Apply config
        if (CONFIG.siteTitle) {
            document.title = CONFIG.siteTitle;
            document.getElementById('gate-title').textContent = CONFIG.siteTitle;
        }
        // An admin-set custom background (synced from vault.html) takes priority over the bundled default,
        // using whatever focal point was picked for it — CONFIG.backgroundPosition only applies to the
        // bundled default photo, since it was tuned for that one specifically.
        const _customBg    = localStorage.getItem('sanctuary-custom-bg');
        const _customBgPos = localStorage.getItem('sanctuary-custom-bg-position');
        const _bgSrc        = _customBg || CONFIG.backgroundImage;
        if (_bgSrc) {
            const _layer = document.querySelector('.bg-layer');
            if (_layer) {
                _layer.style.backgroundImage =
                    `linear-gradient(rgba(14,8,16,.72),rgba(14,8,16,.72)), url('${_bgSrc}')`;
                _layer.style.backgroundPosition = _customBg ? (_customBgPos || 'center') : (CONFIG.backgroundPosition || 'center');
            }
        }

        // Skip gate if already authenticated; unhide only after the async check
        (async () => {
            if (await isAuthenticated()) {
                window.location.href = 'vault.html';
            } else {
                await clearLocalVaultDataIfSignedOut();
                document.getElementById('name-input').value = getLoginName();
                document.body.style.visibility = '';
            }
        })();

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn  = document.getElementById('enter-btn');
            const err  = document.getElementById('error-msg');
            const name = document.getElementById('name-input').value.trim();
            const pw   = document.getElementById('password-input').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Unlocking…</span>';
            err.hidden = true;

            const ok = await login(pw);
            if (ok) setLoginName(name);

            if (ok) {
                document.body.classList.add('unlocking');
                setTimeout(function() { window.location.href = 'vault.html'; }, 750);
            } else {
                btn.disabled = false;
                btn.innerHTML = '<span>Enter</span><span class="btn-arrow">→</span>';
                err.hidden = false;
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Viewer — Our Sanctuary</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
    <link rel="stylesheet" href="css/style.css?v=20260920d">
    <!-- PDF.js — renders PDFs to canvas (no download link exposed) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Add to Home Screen — launches full-screen, without Safari's browser chrome -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Our Sanctuary">
    <meta name="theme-color" content="#0E0810">
</head>
<body class="page-viewer" style="visibility:hidden">

    <header class="viewer-header">
        <button class="back-btn" onclick="window.location.href='vault.html'">← Back</button>
        <h1 class="viewer-title" id="viewer-title">Document</h1>
        <div class="viewer-spacer"></div>
    </header>

    <main class="viewer-main">
        <div class="viewer-content" id="viewer-content">
            <p class="loading-msg">Preparing document…</p>
        </div>
    </main>

    <script src="js/config.js?v=20260920d"></script>
    <script src="js/crypto.js?v=20260920d"></script>
    <script src="js/auth.js?v=20260920d"></script>
    <script src="js/protect.js?v=20260920d"></script>
    <script src="js/storage.js?v=20260920d"></script>
    <script src="js/firebase.js?v=20260920d"></script>
    <script src="js/viewer.js?v=20260920d"></script>
    <script>
        (async () => {
            if (!await isAuthenticated()) {
                await clearLocalVaultDataIfSignedOut();
                window.location.href = 'index.html';
            } else {
                document.body.style.visibility = '';
                loadDoc();
            }
        })();
    </script>
</body>
</html>
